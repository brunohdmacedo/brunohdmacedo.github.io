name: Atualizar citações

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Atualizar citações
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_AUTHOR_ID: ${{ secrets.SERPAPI_AUTHOR_ID }}
        run: python scripts/atualizar_citacoes.py

      - name: Salvar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/citacoes.json
          git diff --cached --quiet || git commit -m "Atualiza citações automaticamente"
          git push
