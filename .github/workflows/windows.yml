name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do release (ex.: 1.0.1)"
        required: true
        default: "1.0.1"
      source_repo:
        description: "Opcional: outro repositório no formato usuario/repo (vazio = este mesmo repo)"
        required: false
        default: ""
      target_path:
        description: "Subpasta dentro do repo (ex.: brumare ou . para raiz)"
        required: false
        default: "brumare"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório principal
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout de repositório externo (se informado)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_repo != '' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source_repo }}
          path: _external_src

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Localizar arquivos do projeto e inspecionar estrutura
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $searchBase = if ("${{ github.event_name }}" -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace("${{ inputs.source_repo }}")) {
            Join-Path $root "_external_src"
          } else {
            $root
          }

          $subPath = if ("${{ github.event_name }}" -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace("${{ inputs.target_path }}")) {
            "${{ inputs.target_path }}".Trim()
          } else {
            "brumare"
          }

          Write-Host "== Estrutura encontrada em $searchBase (até 3 níveis) =="
          Get-ChildItem -Path $searchBase -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "\\\.git\\" } |
            Select-Object -ExpandProperty FullName

          $candidate = if ($subPath -eq "." -or $subPath -eq "./") {
            $searchBase
          } else {
            Join-Path $searchBase ($subPath -replace "/", "\")
          }

          if (-not (Test-Path (Join-Path $candidate "bruma.py") -PathType Leaf)) {
            $found = Get-ChildItem -Path $searchBase -Recurse -Filter "bruma.py" -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch "\\\.git\\" } |
              Select-Object -First 1

            if ($null -eq $found) {
              Write-Error "bruma.py não foi encontrado em '$candidate' nem em subpastas de '$searchBase'. Veja a listagem de arquivos acima."
              exit 1
            }
            $candidate = $found.Directory.FullName
          }

          Write-Host "Diretório do projeto localizado em: $candidate"

          if ($candidate -ne $root) {
            Get-ChildItem -Path $candidate -Force | ForEach-Object {
              if ($_.Name -ne ".git" -and $_.Name -ne "_external_src") {
                $dest = Join-Path $root $_.Name
                Copy-Item -Path $_.FullName -Destination $dest -Recurse -Force
              }
            }
          }

          $obrigatorios = @(
            "bruma.py",
            "bruma_gui.py",
            "assets/bruma.ico",
            "packaging/windows/bruma.iss"
          )
          $faltando = $false
          foreach ($rel in $obrigatorios) {
            $full = Join-Path $root ($rel -replace "/", "\")
            if (-not (Test-Path $full -PathType Leaf)) {
              Write-Host "::error::Falta o arquivo obrigatório: $rel"
              $faltando = $true
            }
          }
          if ($faltando) { exit 1 }
