name: Release Windows

on:
  push:
    tags:
      - "v*"          # ex.: git tag v1.0.1 && git push origin v1.0.1
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do release (ex.: 1.0.1)"
        required: true
        default: "1.0.1"
      create_tag:
        description: "Criar e enviar a tag v<versão> automaticamente?"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preparar arquivos da pasta brumare
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $srcDir = Join-Path $root "brumare"

          if (-not (Test-Path (Join-Path $srcDir "brumare.py") -PathType Leaf)) {
            Write-Error "brumare.py não encontrado em '$srcDir'."
            exit 1
          }

          Write-Host "Copiando arquivos de '$srcDir' para '$root'..."
          Get-ChildItem -Path $srcDir -Force | ForEach-Object {
            if ($_.Name -ne ".git") {
              $dest = Join-Path $root $_.Name
              Copy-Item -Path $_.FullName -Destination $dest -Recurse -Force
            }
          }

          # Garante assets/brumare.ico se estiver apenas na raiz assets/
          New-Item -ItemType Directory -Force -Path (Join-Path $root "assets") | Out-Null
          $icoDest = Join-Path $root "assets\brumare.ico"
          $icoRoot = Join-Path $root "assets\brumare.ico"
          if (-not (Test-Path $icoDest -PathType Leaf) -and (Test-Path (Join-Path $root "brumare\assets\brumare.ico"))) {
            Copy-Item (Join-Path $root "brumare\assets\brumare.ico") $icoDest -Force
          }

          $obrigatorios = @(
            "brumare.py",
            "brumare_gui.py",
            "packaging/windows/brumare.iss"
          )
          $faltando = $false
          foreach ($rel in $obrigatorios) {
            $full = Join-Path $root ($rel -replace "/", "\")
            if (-not (Test-Path $full -PathType Leaf)) {
              Write-Host "::error::Falta o arquivo obrigatório: $rel"
              $faltando = $true
            }
          }
          if ($faltando) { exit 1 }

      - name: Definir versão e atualizar scripts
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".Trim()
          } else {
            $v = "${{ github.ref_name }}" -replace "^v", ""
          }
          $v = $v -replace "^v", ""

          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Versão definida: $v"

          foreach ($pyFile in @("brumare.py", "brumare_gui.py", "brumare_lote.py")) {
            if (Test-Path $pyFile -PathType Leaf) {
              $content = Get-Content -Path $pyFile -Raw -Encoding utf8
              if ($content -match '(?m)^VERSAO\s*=.*$') {
                $updated = [regex]::Replace($content, '(?m)^VERSAO\s*=.*$', "VERSAO = `"$v`"")
                Set-Content -Path $pyFile -Value $updated -Encoding utf8
                Write-Host "Atualizado VERSAO em $pyFile -> $v"
              }
            }
          }

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }
          python -m pip install numpy matplotlib pillow pyinstaller

      - name: Gerar Brumare.exe (janela)
        shell: pwsh
        run: |
          $iconArgs = @()
          if (Test-Path "assets\brumare.ico") {
            $iconArgs = @("--icon", "assets\brumare.ico")
          }
          $dataArgs = @()
          if (Test-Path "assets") {
            $dataArgs += @("--add-data", "assets;assets")
          }
          if (Test-Path "i18n") {
            $dataArgs += @("--add-data", "i18n;i18n")
          }
          if (Test-Path "vendor") {
            $dataArgs += @("--add-data", "vendor;vendor")
          }

          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Brumare `
            @iconArgs `
            @dataArgs `
            --hidden-import PIL._tkinter_finder `
            --exclude-module scipy `
            --exclude-module pandas `
            --exclude-module IPython `
            --exclude-module PyQt5 `
            --exclude-module PyQt6 `
            --exclude-module PySide2 `
            --exclude-module PySide6 `
            --exclude-module notebook `
            --exclude-module jedi `
            --exclude-module sympy `
            brumare_gui.py

      - name: Gerar brumare-cli.exe (linha de comando)
        shell: pwsh
        run: |
          $iconArgs = @()
          if (Test-Path "assets\brumare.ico") {
            $iconArgs = @("--icon", "assets\brumare.ico")
          }

          python -m PyInstaller --noconfirm --clean --onefile --console --name brumare-cli `
            @iconArgs `
            --exclude-module scipy `
            --exclude-module pandas `
            --exclude-module IPython `
            --exclude-module PyQt5 `
            --exclude-module PyQt6 `
            --exclude-module PySide2 `
            --exclude-module PySide6 `
            --exclude-module notebook `
            --exclude-module jedi `
            --exclude-module sympy `
            --exclude-module tkinter `
            brumare.py

      - name: Gerar instalador com Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe não encontrado."
          }

          & $iscc "/DAppVersion=$env:VERSION" "packaging\windows\bruma.iss"

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          if (Test-Path "Output") {
            Get-ChildItem -Path "Output" -Filter "*.exe" | Copy-Item -Destination "dist" -Force
          }

      - name: Padronizar nomes finais e gerar SHA256SUMS.txt
        shell: pwsh
        run: |
          $v = $env:VERSION
          Set-Location "dist"

          if (Test-Path "Brumare.exe") {
            Move-Item "Brumare.exe" "Brumare-$v-portable.exe" -Force
          }
          if (Test-Path "bruma-cli.exe") {
            Move-Item "bruma-cli.exe" "brumare-cli-$v.exe" -Force
          }
          if (Test-Path "brumare-cli.exe") {
            Move-Item "brumare-cli.exe" "brumare-cli-$v.exe" -Force
          }

          $exeFiles = Get-ChildItem -Filter "*.exe" | Sort-Object Name
          if (-not $exeFiles) {
            throw "Nenhum arquivo .exe encontrado em dist/."
          }

          $hashes = foreach ($file in $exeFiles) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $hashes | Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8
          Get-ChildItem -Force

      - name: Criar tag via workflow_dispatch (opcional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_tag }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $tag = "v$env:VERSION"
          if (-not (git tag -l $tag)) {
            git tag $tag
            git push origin $tag
          }

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: BrUMaRe ${{ env.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*Setup*.exe
            dist/Brumare-*-portable.exe
            dist/brumare-cli-*.exe
            dist/SHA256SUMS.txt
